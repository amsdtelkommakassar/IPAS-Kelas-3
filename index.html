<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siklus Makhluk Hidup dan Perubahan Alam - Petualangan Bangjack (IPAS Kelas 3)</title>
<style>
:root{--ink:#1f2a44;--sun:#ffc43d;--red:#e5484d;--blue:#2f6fed;--green:#2e9e48;--teal:#1a7a6e}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.5;color:var(--ink);min-height:100vh;background:linear-gradient(#8fd3f4,#d9f3ff 40%,#fff6d6 70%,#b9e5a0) fixed}
.hud{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;border-bottom:4px solid var(--sun)}
.hud>div{max-width:880px;margin:auto;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{background:#fff;color:var(--ink);border-radius:99px;padding:3px 11px;font-weight:800;font-size:.85rem;white-space:nowrap;display:inline-block}
.pbar{height:9px;background:#115a50}.pbar i{display:block;height:100%;background:var(--sun);transition:width .5s}
main{max-width:880px;margin:auto;padding:14px 12px 60px}
.pg{animation:slide .38s ease-out}@keyframes slide{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(31,42,68,.14)}
.c{text-align:center}
h1{font-size:2rem;margin:.1em 0;line-height:1.15}h2{font-size:1.35rem;margin:.2em 0 .4em;line-height:1.25}h3{font-size:1.05rem;margin:.2em 0}
.meta{font-size:.85rem;color:#5b6784;font-weight:700;margin-bottom:6px}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:12px 18px;min-height:48px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);margin:4px 4px 4px 0;transition:transform .1s}
.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:disabled{opacity:.45;cursor:not-allowed}
.go{background:var(--green);color:#fff}.ghost{background:#e2e8f0;color:var(--ink)}.warn{background:var(--sun);color:var(--ink)}.red{background:var(--red);color:#fff}
.big{font-size:1.2rem;padding:16px 22px}
:focus-visible{outline:4px solid #f97316;outline-offset:2px}
.say{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.bub{background:#eef6ff;border-radius:6px 20px 20px 20px;padding:8px 14px;flex:1;border:2px solid #cfe2ff}
.bub b{font-size:.8rem;color:var(--blue);display:block}.bub p{margin:0}
.jk{flex-shrink:0;animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}
.ill{width:100%;height:auto;display:block;border-radius:18px;border:3px solid #dbeafe;margin:8px 0}
.tile{border-radius:16px;padding:10px 12px;background:#f1f7ff;border:2px solid #cfe2ff;margin:8px 0}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;background:#fff;border:3px solid #cbd5e1;border-radius:16px;padding:10px 14px;margin:8px 0;cursor:pointer;min-height:50px;align-items:center;transition:transform .12s,border-color .12s}
.opt b{background:#e2e8f0;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex-shrink:0}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(4px)}
.opt.ok{background:#dcfce7;border-color:var(--green);animation:pop .5s}.opt.bad{background:#fee2e2;border-color:#dc2626;animation:shake .4s}
.fb{border-radius:14px;padding:8px 12px;margin:8px 0;font-size:.95rem}.fb.ok{background:#dcfce7}.fb.bad{background:#fee2e2}.fb.info{background:#fef9c3}
@keyframes pop{40%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dots{display:flex;gap:6px;margin:6px 0}.dots i{width:14px;height:14px;border-radius:50%;background:#e2e8f0;border:2px solid #cbd5e1}
.dots i.d{background:var(--green);border-color:var(--green)}.dots i.x{background:var(--red);border-color:var(--red)}.dots i.n{border-color:var(--blue);transform:scale(1.25)}
input,select{font:inherit;padding:10px 12px;border-radius:12px;border:3px solid #cbd5e1;max-width:100%;background:#fff;width:100%}
label{font-weight:800;display:block;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.map{position:relative;max-width:420px;margin:auto}
.map svg{display:block;width:100%;height:auto;border-radius:26px;border:4px solid #fff;box-shadow:0 5px 0 rgba(31,42,68,.14)}
.node{position:absolute;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--sun);font-size:32px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:bob 2.6s ease-in-out infinite;padding:0}
.node.dn{background:var(--green)}.node.lk{filter:grayscale(1);opacity:.65;cursor:not-allowed;animation:none}
.nl{position:absolute;transform:translate(-50%,0);font-size:.78rem;font-weight:800;text-align:center;background:#fff;border-radius:10px;padding:1px 8px;white-space:nowrap}
.bigsc{font-size:3rem;font-weight:900;line-height:1}.stars{font-size:2.2rem;letter-spacing:4px}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:104px;padding:8px;margin:4px;border-radius:16px;background:#fef3c7;font-size:.78rem;text-align:center;font-weight:800}
.badge span{font-size:1.9rem}.badge.off{filter:grayscale(1);opacity:.45}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:2px solid #cbd5e1;padding:6px 8px;text-align:left;vertical-align:middle}th{background:var(--teal);color:#fff}
.pb2{height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden;min-width:70px}.pb2 i{display:block;height:100%;background:var(--green)}
.fx{position:fixed;top:-30px;font-size:28px;pointer-events:none;animation:fall 1.9s ease-in forwards;z-index:99}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.plus{position:fixed;left:50%;top:34%;transform:translateX(-50%);font-size:2.6rem;font-weight:900;color:#16a34a;text-shadow:0 2px 0 #fff,0 0 12px #fff;animation:rise 1.2s ease-out forwards;pointer-events:none;z-index:99}
@keyframes rise{to{transform:translate(-50%,-90px);opacity:0}}
details{margin:10px 0;font-size:.9rem}
.hero{padding:16px 12px;background:linear-gradient(#8fd3f4,#d9f3ff 60%,#fff6d6)}
.kick{display:inline-block;background:var(--sun);border-radius:99px;padding:3px 14px;font-weight:900;font-size:.82rem;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.ttl{font-size:clamp(1.5rem,6.6vw,2.5rem);font-weight:900;line-height:1.1;margin:10px 0 4px;color:var(--teal);text-shadow:0 3px 0 #fff,0 5px 0 rgba(31,42,68,.18)}
.ttl em{font-style:normal;color:var(--red);display:block}
.zoo{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;font-size:2.4rem;margin:10px 0 0}
.zoo span{animation:bob 2s ease-in-out infinite}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 2px}
.chip2{background:#fff;border:2px solid #cfe2ff;border-radius:99px;padding:3px 12px;font-weight:800;font-size:.85rem}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;background:#f1f7ff;border:2px solid #cfe2ff;border-radius:16px;padding:8px 12px;margin:8px 0}
.steps .n{flex:0 0 36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;display:grid;place-items:center}
.steps p{margin:0;font-size:.95rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:480px){body{font-size:17px}h1{font-size:1.6rem}.btn{padding:10px 14px}}
.logo{display:block;margin:0 auto 10px;width:min(300px,80%);height:auto;background:#fff;border-radius:18px;padding:6px 10px;box-shadow:0 4px 0 rgba(31,42,68,.16)}
.mbtn{position:fixed;right:12px;bottom:12px;z-index:30;border-radius:99px;padding:10px 16px;font-size:.95rem;margin:0}
.vwrap{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;border:3px solid #dbeafe;background:#000}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mbtn.pulse{animation:pls 1.6s ease-in-out infinite}@keyframes pls{50%{transform:scale(1.08)}}
</style>
</head>
<body>

<main id="app"></main>
<button id="mbtn" class="btn warn mbtn pulse" onclick="MUS.toggle()" aria-pressed="false">🎵 Putar Musik</button>
<script>
"use strict";
/* ===== KONFIGURASI SUPABASE (publishable key saja, jangan taruh secret/service_role) ===== */
const CFG={supabase:{projectUrl:"https://ttgiswktlcxowjudufkl.supabase.co",publishableKey:"sb_publishable_dwaAJ64wqPistC7mfHsfPw_GN6nC__B"}};
/* Isi ID file Google Drive jika ingin menampilkan tombol video di beranda, contoh: ["1abcDEF..."] */
const VIDEOS=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const h53=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507);a^=Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507);b^=Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fm=n=>String(Math.round(n*10)/10).replace(".",",");

/* ===== PENYIMPANAN ===== */
const lsGet=(k="kp_hasil")=>{try{return JSON.parse(localStorage.getItem(k)||"{}")}catch(e){return{}}};
const lsSet=r=>{try{const o=lsGet();o[r.k]=r;localStorage.setItem("kp_hasil",JSON.stringify(o))}catch(e){}};
const DB={sb:null,note:"",uid:null,
async init(){const c=CFG.supabase;if(!c.projectUrl||!c.publishableKey){DB.note="Supabase belum diisi: data hanya tersimpan di perangkat ini.";return}
try{await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=ok;s.onerror=no;document.head.appendChild(s)});DB.sb=window.supabase.createClient(c.projectUrl,c.publishableKey)}catch(e){DB.note="Supabase gagal dimuat. Data disimpan di perangkat ini."}},
async anon(){const{data,error}=await DB.sb.auth.getSession();if(error)throw error;let u=data.session?.user;if(!u||!u.is_anonymous){const r=await DB.sb.auth.signInAnonymously();if(r.error)throw r.error;u=r.data.user}return u.id},
async put(r){lsSet(r);if(!DB.sb||!DB.uid)return false;
const{error}=await DB.sb.from("hasil_kuis").upsert({user_id:DB.uid,nama_siswa:r.nama,kelas:r.kode,nilai:r.nilai,skor:r.skor,maks:r.maks,benar:r.benar,salah:r.salah,jawab:r.jawab,prog:r.prog,status:r.status,detail_jawaban:r.det,created_at:r.t},{onConflict:"user_id"});
if(error){console.error("Gagal menyimpan:",error);return false}return true},
async list(){if(!DB.sb)return Object.values(lsGet());
const{data,error}=await DB.sb.from("hasil_kuis").select("user_id,nama_siswa,kelas,nilai,skor,maks,benar,salah,jawab,prog,status,detail_jawaban,created_at").order("created_at",{ascending:false});
if(error)throw error;return(data||[]).map(x=>({k:x.user_id,nama:x.nama_siswa,kode:x.kelas,nilai:+x.nilai||0,skor:+x.skor||0,maks:+x.maks||0,benar:+x.benar||0,salah:+x.salah||0,jawab:+x.jawab||0,prog:+x.prog||0,status:x.status||"Baru masuk",t:x.created_at}))},
async clear(){if(!DB.sb){localStorage.removeItem("kp_hasil");return}
const{data,error}=await DB.sb.from("hasil_kuis").select("user_id");if(error)throw error;
for(const x of data||[]){const r=await DB.sb.from("hasil_kuis").delete().eq("user_id",x.user_id);if(r.error)throw r.error}}};

/* ===== KARAKTER BANGJACK ===== */
function jackG(e){const sk="#f2b27a",st=`stroke="${sk}" stroke-width="8" stroke-linecap="round" fill="none"`;
let aR=`<path d="M68 80Q82 94 76 104" ${st}/>`,x="";
if(e==="semangat")aR=`<path d="M68 80Q90 66 84 46" ${st}/><circle cx="84" cy="41" r="7" fill="${sk}"/>`;
if(e==="pikir")x='<text x="76" y="20" font-size="22" font-weight="900" fill="#2f6fed">?</text>';
if(e==="kaget")x='<text x="44" y="12" font-size="22" font-weight="900" fill="#e5484d">!</text>';
const eyes=e==="senang"?'<path d="M36 48Q41 42 46 48M54 48Q59 42 64 48" stroke="#1f2a44" stroke-width="3" fill="none" stroke-linecap="round"/>':e==="kaget"?'<circle cx="41" cy="48" r="6" fill="#fff" stroke="#1f2a44" stroke-width="2"/><circle cx="59" cy="48" r="6" fill="#fff" stroke="#1f2a44" stroke-width="2"/><circle cx="41" cy="48" r="2.5" fill="#1f2a44"/><circle cx="59" cy="48" r="2.5" fill="#1f2a44"/>':'<circle cx="41" cy="48" r="3.5" fill="#1f2a44"/><circle cx="59" cy="48" r="3.5" fill="#1f2a44"/>';
const mouth=e==="kaget"?'<ellipse cx="50" cy="62" rx="4.5" ry="6" fill="#7f1d1d"/>':e==="pikir"?'<path d="M43 61Q50 58 57 62" stroke="#7f1d1d" stroke-width="3" fill="none" stroke-linecap="round"/>':e==="semangat"?'<path d="M40 56Q50 72 60 56Z" fill="#7f1d1d"/>':'<path d="M42 57Q50 66 58 57" stroke="#7f1d1d" stroke-width="3" fill="none" stroke-linecap="round"/>';
return x+`<path d="M32 80Q18 94 24 104" ${st}/>`+aR+`<rect x="30" y="72" width="40" height="36" rx="10" fill="#2e9e48"/><rect x="46" y="72" width="8" height="36" fill="#fff"/><rect x="35" y="106" width="11" height="12" rx="3" fill="#1f2a44"/><rect x="54" y="106" width="11" height="12" rx="3" fill="#1f2a44"/><circle cx="24" cy="50" r="5" fill="${sk}"/><circle cx="76" cy="50" r="5" fill="${sk}"/><circle cx="50" cy="48" r="26" fill="${sk}"/><path d="M22 38L22 28Q50 6 78 28L78 38Q50 30 22 38Z" fill="#a16207"/><rect x="22" y="33" width="56" height="4" fill="#fde68a"/><circle cx="34" cy="58" r="4" fill="#f9a8a8" opacity=".7"/><circle cx="66" cy="58" r="4" fill="#f9a8a8" opacity=".7"/>`+eyes+mouth}
const jack=(e,w)=>`<svg class="jk" viewBox="0 0 100 120" width="${w}" height="${Math.round(w*1.2)}" role="img" aria-label="Bangjack">${jackG(e)}</svg>`;
const bub=(e,t)=>`<div class="say">${jack(e,64)}<div class="bub"><b>Bangjack</b><p>${t}</p></div></div>`;

/* ===== ILUSTRASI (emoji di dalam SVG) ===== */
const ill=(alt,em,bg,cap)=>{const n=em.length,sp=300/n;return`<svg class="ill" viewBox="0 0 300 150" role="img" aria-label="${alt}"><rect width="300" height="150" fill="${bg||"#bfe9ff"}"/><rect y="118" width="300" height="32" fill="#4cb050"/>`+em.map((e,i)=>`<text x="${sp*i+sp/2}" y="${n>4?92:98}" font-size="${n>4?36:46}" text-anchor="middle">${e}</text>`).join("")+(cap?`<rect x="60" y="8" width="180" height="26" rx="8" fill="#fff" stroke="#1a7a6e" stroke-width="3"/><text x="150" y="26" font-size="12" font-weight="800" text-anchor="middle" fill="#1f2a44">${cap}</text>`:"")+"</svg>"};
const SC={
telur:()=>ill("Hewan bertelur dan melahirkan",["🐔","🥚","🐈","🐋"],"#bfe9ff","Ovipar dan Vivipar"),
tumbuh:()=>ill("Biji tumbuh menjadi tanaman",["🌰","🌱","🌿","🌽"],"#fff1c9","Biji → Kecambah → Dewasa"),
meta:()=>ill("Metamorfosis belalang dan kupu-kupu",["🥚","🐛","🦋","🦗"],"#d9f3ff","Metamorfosis"),
katak:()=>ill("Siklus hidup katak",["🥚","🐟","🐸"],"#c8efe0","Siklus Katak"),
ayam:()=>ill("Siklus hidup ayam",["🥚","🐣","🐥","🐔"],"#fff1c9","Siklus Ayam"),
lestari:()=>ill("Menjaga hutan dan satwa",["🌳","🐿️","🦜","🌲"],"#c8efe0","Lestarikan Satwa"),
malam:()=>ill("Hewan siang dan malam",["🐒","☀️","🌙","🦇"],"#1e2a5a","Diurnal dan Nokturnal"),
cuaca:()=>ill("Hewan menyesuaikan musim",["🐸","🌧️","❄️","🐻"],"#d9f3ff","Cuaca dan Musim")};

/* ===== MATERI DAN SOAL (Erlangga Sprint IPAS Kelas 3, Bab 4) ===== */
const L=[{nm:"Kandang Telur",sub:"Cara makhluk hidup berkembang biak",ic:"🥚"},{nm:"Kolam Metamorfosis",sub:"Siklus hidup hewan",ic:"🐸"},{nm:"Hutan Lestari",sub:"Pelestarian, hari, cuaca, dan musim",ic:"🌳"}];
const M=[
{lv:1,t:"Hewan berkembang biak dengan cara berbeda",ill:"telur",e:"senang",say:"Halo, aku Bangjack! Siklus hidup adalah perubahan makhluk hidup sepanjang hidupnya. Agar tidak punah, makhluk hidup berkembang biak.",pts:["<b>Ovipar</b>: berkembang biak dengan bertelur, telur menetas menjadi anak. Contoh: ayam, burung, ikan.","<b>Vivipar</b>: berkembang biak dengan melahirkan, anak tumbuh di dalam tubuh induk. Contoh: kucing, sapi, paus.","<b>Ovovivipar</b>: telur ada dan menetas di dalam tubuh induk, lalu keluar sebagai anak. Contoh: ular derik, hiu, beberapa jenis ikan."],tip:"Ovipar bertelur, Vivipar melahirkan, Ovovivipar menetas di dalam tubuh!"},
{lv:1,t:"Perkembangbiakan tumbuhan",ill:"tumbuh",e:"pikir",say:"Tumbuhan juga berkembang biak, lho. Ada yang dengan biji, ada yang tanpa biji.",pts:["<b>Generatif</b>: dengan biji. Siklus: biji, kecambah, tumbuhan muda, tumbuhan dewasa (berbunga dan berbiji). Contoh: padi, jagung, kacang, mangga.","<b>Vegetatif alami</b>: tanpa biji, memakai bagian lain secara alami. Pisang dengan tunas, bawang merah dan kentang dengan umbi, jahe dengan rimpang.","<b>Vegetatif buatan</b>: dibantu manusia agar hasil lebih baik. Mangga dengan cangkok, singkong dengan stek."],tip:"Generatif pakai biji. Vegetatif tanpa biji."},
{lv:2,t:"Metamorfosis: berubah bentuk bertahap",ill:"meta",e:"semangat",say:"Metamorfosis adalah perubahan bentuk tubuh secara bertahap. Ada dua jenis!",pts:["<b>Tidak sempurna</b>: bentuk anak dan dewasa tidak terlalu berbeda. Telur, belalang muda, belalang dewasa. Contoh: belalang, kecoak, capung.","<b>Sempurna</b>: bentuk tubuh sangat berbeda di setiap tahap. Contoh: kupu-kupu, katak, semut."],tip:"Tidak sempurna: mirip. Sempurna: beda sekali!"},
{lv:2,t:"Siklus hidup katak dan ayam",ill:"katak",e:"senang",say:"Katak bermetamorfosis sempurna. Ayam tidak bermetamorfosis, hanya tumbuh besar.",pts:["<b>Katak</b>: telur, berudu (kecebong), berudu berkaki, katak muda, katak dewasa.","<b>Ayam (tidak bermetamorfosis)</b>: telur, anak ayam berbulu halus, ayam remaja (tumbuh bulu dan jengger), ayam dewasa (usia sekitar enam bulan, siap bertelur lagi)."],tip:"Berudu berubah jadi katak. Anak ayam tidak berubah bentuk."},
{lv:3,t:"Upaya pelestarian makhluk hidup",ill:"lestari",e:"semangat",say:"Hewan dan tumbuhan bermanfaat bagi manusia, jadi harus dilestarikan agar tidak punah.",pts:["<b>Melestarikan habitat alami</b>: melindungi hutan, membuat taman nasional, menjaga ekosistem.","<b>Mengendalikan pemanfaatan sumber daya alam</b>: memakai secukupnya.","<b>Meningkatkan kesadaran lingkungan</b>: menjaga kebersihan, menanam pohon, ikut kegiatan peduli lingkungan.","<b>Rehabilitasi dan penangkaran</b>: merawat hewan langka dan memulihkan ekosistem yang rusak."],tip:"Lindungi hutan, tanam pohon, rawat satwa langka!"},
{lv:3,t:"Pergantian hari",ill:"malam",e:"pikir",say:"Hewan dan tumbuhan punya kegiatan berbeda saat siang dan malam.",pts:["<b>Diurnal</b>: hewan aktif siang hari, seperti monyet dan kambing.","<b>Nokturnal</b>: hewan aktif malam hari, seperti kelelawar dan kukang.","<b>Tumbuhan</b>: pagi dan siang melakukan fotosintesis (membuat makanan), malam melakukan respirasi."],tip:"Diurnal = siang. Nokturnal = malam."},

<div class="card"><h2>Rapor Petualangan: ${esc(S.nama)} (${esc(S.kode)})</h2><p>Jawaban benar penuh: <b>${b}</b> | Belum tepat: <b>${Q.length-b}</b></p><div class="wrap"><table><tr><th>Level</th><th>Soal</th><th>Maks</th><th>Perolehan</th><th>Bintang</th></tr>${[1,2,3].map(l=>`<tr><td>${L[l-1].nm}</td><td>${qsOf(l).length}</td><td>${qsOf(l).reduce((s,q)=>s+q.w,0)}</td><td>${fm(qsOf(l).reduce((s,q)=>s+got(q),0))}</td><td>${"⭐".repeat(lvStars(l))}</td></tr>`).join("")}<tr><th colspan="2">Total</th><th>${maxs()}</th><th>${fm(score())}</th><th></th></tr></table></div><p class="meta">Tiap soal bernilai 10 poin. Jawaban benar mendapat poin penuh, salah 0 poin. Soal mencocokkan dan menyusun urutan mendapat poin sebagian sesuai jumlah yang benar.</p><h3>Lencanamu</h3>${badges().map(x=>`<div class="badge ${x[2]?"":"off"}"><span>${x[0]}</span>${x[1]}</div>`).join("")}<p><button class="btn warn" onclick="ulang()">🔄 Main lagi</button><button class="btn ghost" onclick="keluar()">🏠 Selesai dan keluar</button></p></div>`},

const err=t=>{const e=$("#er");e.textContent=t;e.hidden=false};
async function mulai(){const n=$("#nm").value.trim().replace(/\s+/g," "),k=$("#kd").value.trim().toUpperCase().replace(/\s+/g,"");
if(n.length<2)return err("Tulis namamu dulu, minimal 2 huruf ya.");if(k.length<2)return err("Tulis kode kelasmu dulu ya.");
S={role:"siswa",guru:false,nama:n,kode:k,ans:{},tmp:{},fail:0,until:0,pop:false};
if(DB.sb){try{DB.uid=await DB.anon()}catch(e){DB.uid=null;alert("Koneksi ke server belum aktif. Nilaimu tersimpan di perangkat ini dulu.")}}
const old=lsGet()[keyOf()];let back=false;
if(old&&old.det){Object.keys(old.det).forEach(id=>{const q=Qb(+id);if(q)S.ans[q.id]={p:old.det[id],sel:-1,e:old.det[id]===q.w?"senang":"pikir",m:"Jawabanmu tadi sudah tersimpan."}});back=Object.keys(S.ans).length>0}
save();burst(10);go("peta");if(back)plus("Selamat datang kembali! 👋")}
function ulang(){S.ans={};S.tmp={};save();go("peta")}
async function masuk(){if(Date.now()<S.until)return err("Terlalu banyak percobaan. Tunggu 30 detik.");
const pw=$("#pw").value;let ok=false;
try{if(DB.sb){const{data,error}=await DB.sb.auth.signInWithPassword({email:$("#em").value.trim(),password:pw});if(error)throw error;
const c=await DB.sb.from("guru_access").select("user_id").eq("user_id",data.user.id).maybeSingle();if(c.error||!c.data)throw new Error("Akun ini belum diberi akses guru.");ok=true}
else{let s=null;try{s=localStorage.getItem("kp_pw")}catch(e){}
if(!s){if(pw.length<6)return err("Buat sandi baru, minimal 6 karakter.");try{localStorage.setItem("kp_pw",h53("kp:"+pw))}catch(e){}ok=true}else ok=h53("kp:"+pw)===s}}catch(e){ok=false}
if(!ok){if(++S.fail>=5){S.until=Date.now()+30000;S.fail=0}return err(DB.sb?"Email/sandi salah atau akun belum terdaftar sebagai guru.":"Sandi salah.")}
S.role="guru";S.guru=true;go("dash")}
async function hapusSemua(){if(!confirm("Hapus SEMUA data nilai siswa? Tindakan ini tidak dapat dibatalkan."))return;
try{await DB.clear();alert("Data siswa berhasil dihapus.");V.p.rows=null;render(1)}catch(e){console.error(e);alert("Gagal menghapus data: "+(e.message||e))}}
function csv(){const q=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'},f=V.p.f||"";
const rows=(V.p.rows||[]).filter(r=>!f||r.kode===f).map(r=>[r.nama,r.kode,r.skor,r.maks,r.nilai,r.benar,r.salah,r.prog,r.status,r.t].map(q).join(","));
const b=new Blob(["\ufeff"+["Nama","Kelas","Skor","Skor Maks","Nilai","Benar","Salah","Progres (%)","Status","Waktu"].map(q).join(",")+"\n"+rows.join("\n")],{type:"text/csv"}),a=document.createElement("a");
a.href=URL.createObjectURL(b);a.download="rekap-nilai-ipas-bab4.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function fin(q,p,sel){const full=p===q.w;
S.ans[q.id]={p,sel,e:full?pick(["senang","semangat"]):p>0?"semangat":"pikir",m:full?pick(["Hebat! Jawabanmu benar!","Keren! Kamu pintar sekali!","Tepat sekali, teman!"]):p>0?"Lumayan! Sebagian jawabanmu sudah benar.":"Belum tepat. Ayo coba lagi di soal berikutnya!"};
if(p>0){plus("+"+fm(p));burst(full?16:6)}save();render(1)}
function pk(id,j){const q=Qb(id);if(S.ans[q.id])return;fin(q,j===q.a?q.w:0,j)}
function tm(id,k,v){S.tmp[id][k]=v;const q=Qb(id);$("#chk").disabled=!q.pairs.every((p,i)=>S.tmp[id][i])}
function od(id,v){const q=Qb(id),t=S.tmp[id]||(S.tmp[id]=[]);if(t.length<q.ord.length&&t.indexOf(v)<0)t.push(v);render(1)}
function ck(id){const q=Qb(id),t=S.tmp[id]||[];if(S.ans[id])return;
const c=q.type==="match"?q.pairs.filter((p,k)=>t[k]===p[1]).length:q.ord.filter((x,k)=>t[k]===x).length,n=q.type==="match"?q.pairs.length:q.ord.length;
fin(q,c*q.w/n,0)}

const MUS={ctx:null,m:null,nb:null,on:false,ever:false,tm:null,st:0,nt:0,wasOn:false,BPM:104,
F:[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880],
MEL:[5,-1,7,8,7,-1,5,-1,6,-1,8,9,8,-1,6,-1,4,-1,5,6,5,-1,4,-1,5,6,7,-1,6,5,3,-1,5,-1,7,8,9,-1,8,7,8,-1,7,6,7,-1,5,-1,6,7,8,-1,7,6,5,-1,5,-1,3,-1,5,-1,-1,-1],

start(){try{if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=this.ctx=new A(),k=c.createDynamicsCompressor(),g=c.createGain();g.gain.value=.5;g.connect(k);k.connect(c.destination);this.m=g;const b=this.nb=c.createBuffer(1,Math.floor(c.sampleRate*.5),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
this.ctx.resume();this.ever=true;if(!this.on){this.on=true;this.st=0;this.nt=this.ctx.currentTime+.08;this.tm=setInterval(()=>this.tick(),60)}}catch(e){}this.ui()},
